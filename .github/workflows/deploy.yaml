name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      # Regenerate rather than trust the committed copies, so content whose
      # frontmatter changed without the generators being re-run still deploys
      # correctly. All three use the stdlib only — no venv needed.
      #
      # Order matters: gen_game_data rewrites the spell/miracle metadata blocks
      # from frontmatter, and gen_llms_txt reads the finished pages, so the
      # index it writes describes what actually ships.
      - name: Generate view manifest
        run: python3 scripts/gen_view_manifest.py

      - name: Generate game data
        run: python3 scripts/gen_game_data.py

      - name: Generate llms.txt
        run: python3 scripts/gen_llms_txt.py

      - name: Build site
        run: uv run zensical build

      # Post-build: drop each page's Markdown source next to its rendered
      # HTML, so appending "index.md" to any page URL returns the source.
      - name: Emit raw Markdown pages
        run: python3 scripts/gen_llms_txt.py --site-dir site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
